name: Build Android ImGui Executable

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: vulkan
            opengl: 0
          - name: opengl
            opengl: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK (r25c)
        run: |
          curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q ndk.zip
          echo "NDK_HOME=${GITHUB_WORKSPACE}/android-ndk-r25c" >> "${GITHUB_ENV}"

      - name: Select render backend
        working-directory: YoloTouchImgui/imgui_overlay
        run: |
          sed -i "s/^OPENGL_DRAW = .*/OPENGL_DRAW = ${{ matrix.variant.opengl }}/" Android.mk
          grep -n '^OPENGL_DRAW' Android.mk

      - name: Build with ndk-build
        working-directory: YoloTouchImgui/imgui_overlay
        run: |
          export PATH="${NDK_HOME}:${PATH}"
          # 注意：Application.mk 位于工程根目录，ndk-build 只在 $(NDK_PROJECT_PATH)/jni/ 下查找，
          # 因此 APP_STL / APP_ABI / APP_PLATFORM 需显式传入，否则 libc++ 不会链接导致 STL 符号未定义。
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_STL=c++_static APP_ABI=arm64-v8a APP_PLATFORM=android-21 -j2

      - name: Show outputs
        run: |
          find YoloTouchImgui/imgui_overlay/libs -type f -exec ls -lh {} \;

      - name: Upload executable (${{ matrix.variant.name }})
        uses: actions/upload-artifact@v4
        with:
          name: imgui-${{ matrix.variant.name }}-arm64
          path: YoloTouchImgui/imgui_overlay/libs/arm64-v8a/
          if-no-files-found: error
