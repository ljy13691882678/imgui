name: Build Android APK + ImGui Executable

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: vulkan
            opengl: 0
          - name: opengl
            opengl: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK (r25c)
        run: |
          curl -sL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q ndk.zip
          echo "NDK_HOME=${GITHUB_WORKSPACE}/android-ndk-r25c" >> "${GITHUB_ENV}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: default

      - name: Configure Gradle SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > YoloTouchImgui/local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "${GITHUB_ENV}"
          echo "local.properties created:"
          cat YoloTouchImgui/local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select render backend
        working-directory: YoloTouchImgui/imgui_overlay
        run: |
          sed -i "s/^OPENGL_DRAW = .*/OPENGL_DRAW = ${{ matrix.variant.opengl }}/" Android.mk
          grep -n '^OPENGL_DRAW' Android.mk

      - name: Build imgui native executable
        working-directory: YoloTouchImgui/imgui_overlay
        run: |
          export PATH="${NDK_HOME}:${PATH}"
          # Application.mk 位于工程根目录，ndk-build 只在 $(NDK_PROJECT_PATH)/jni/ 下查找，
          # 因此 APP_STL / APP_ABI / APP_PLATFORM 需显式传入，否则 libc++ 不会链接导致 STL 符号未定义。
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_STL=c++_shared APP_ABI=arm64-v8a APP_PLATFORM=android-21 -j2

      - name: Stage native files into APK assets
        working-directory: YoloTouchImgui
        run: |
          ASSETS="app/src/main/assets/native"
          mkdir -p "$ASSETS/lib" "$ASSETS/models"
          # imgui 可执行文件
          cp imgui_overlay/libs/arm64-v8a/imgui "$ASSETS/imgui"
          # 全部模型（复制到 models/ 子目录 + 根目录保留默认模型）
          cp models/*.tflite "$ASSETS/models/"
          cp models/valorant_256_v26n.tflite "$ASSETS/valorant_256_v26n.tflite"
          # 预编译 .so（TFLite / QNN）
          cp imgui_overlay/lib/arm64-v8a/*.so "$ASSETS/lib/"
          echo "=== staged assets ==="
          find "$ASSETS" -type f -exec ls -lh {} \;

      - name: Build APK with Gradle
        working-directory: YoloTouchImgui
        run: |
          # 使用仓库内固定的 release.jks（签名固定，覆盖安装无需卸载重装）。
          # 若不存在（如首次本地构建前），回退生成临时 keystore。
          if [ ! -f release.jks ]; then
            keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 \
              -validity 10000 -alias yolotouch \
              -storepass yolotouch -keypass yolotouch \
              -dname "CN=YoloTouch, OU=Dev, O=YoloTouch, L=CN, S=CN, C=CN" || true
          fi
          export KEYSTORE_PATH="${GITHUB_WORKSPACE}/YoloTouchImgui/release.jks"
          export KEYSTORE_PASSWORD=yolotouch
          export KEY_ALIAS=yolotouch
          export KEY_PASSWORD=yolotouch
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Show APK
        run: |
          find YoloTouchImgui/app/build -name '*.apk' -exec ls -lh {} \;
          echo "=== signing check ==="
          for apk in $(find YoloTouchImgui/app/build -name '*.apk'); do
            echo "-- $apk"
            unzip -l "$apk" | grep -E "META-INF/.*\.(RSA|DSA|EC|SF|MF)" | grep -v "version" || echo "NO SIGNATURE FOUND"
          done

      - name: Upload APK (${{ matrix.variant.name }})
        uses: actions/upload-artifact@v4
        with:
          name: YoloTouchImgui-aim-trigger-${{ matrix.variant.name }}.apk
          path: YoloTouchImgui/app/build/outputs/apk/release/*.apk
          if-no-files-found: error