name: Build APK (Android 16)

on:
  # 推送代码到任意分支时自动触发
  push:
  # 也可以手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build ImGui Overlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 36, build-tools, NDK)
        run: |
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.1.12297006"

      - name: Cache TensorFlow Lite build
        id: cache-tflite
        uses: actions/cache@v4
        with:
          path: |
            tf_src
            tf_build
            third_party/tflite
          key: tflite-${{ runner.os }}-${{ hashFiles('.github/workflows/build-apk.yml') }}

      - name: Build TensorFlow Lite (NDK arm64, NNAPI enabled)
        if: steps.cache-tflite.outputs.cache-hit != 'true'
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          git clone --depth 1 --branch v2.16.1 https://github.com/tensorflow/tensorflow.git tf_src
          cmake -S tf_src/tensorflow/lite -B tf_build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTFLITE_ENABLE_XNNPACK=OFF \
            -DTFLITE_BUILD_WITH_NNAPI=ON \
            -DTFLITE_ENABLE_GPU=OFF
          cmake --build tf_build -j2 --target tensorflow-lite

      - name: Stage TFLite lib + headers
        run: |
          set -e
          mkdir -p third_party/tflite/lib
          cp tf_build/libtensorflow-lite.a third_party/tflite/lib/
          echo "TFLITE_ROOT=$GITHUB_WORKSPACE/tf_src" >> "$GITHUB_ENV"
          echo "TFLITE_LIB_DIR=$GITHUB_WORKSPACE/tf_build" >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed with debug key)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 上传原生可执行文件（便于 adb 直接推送调试）
      - name: Upload native binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imgui_overlay-executable
          path: app/build/nativeBuild/arm64-v8a/imgui_overlay
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imgui-overlay-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error