name: Build APK (Android 16)

on:
  # 推送代码到任意分支时自动触发
  push:
  # 也可以手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build ImGui Overlay APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 36, build-tools, NDK)
        run: |
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;27.1.12297006"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (signed with debug key)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 上传原生可执行文件（便于 adb 直接推送调试）
      - name: Upload native binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imgui_overlay-executable
          path: app/build/nativeBuild/arm64-v8a/imgui_overlay
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imgui-overlay-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error