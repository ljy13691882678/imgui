name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 与本地沙箱构建环境保持一致：platform-34 + build-tools 34 + NDK r25c
      - name: Install platform / build-tools / NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # build.gradle.kts release 签名回退到 $ANDROID_HOME/.android/debug.keystore
      - name: Generate debug keystore
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/.android"
          keytool -genkeypair -keystore "$ANDROID_SDK_ROOT/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build native imgui (ndk-build)
        working-directory: imgui_overlay
        run: |
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. NDK_APPLICATION_MK=./Application.mk
          test -f libs/arm64-v8a/imgui && echo "native imgui built OK"

      - name: Populate APK assets/native
        run: |
          set -e
          mkdir -p app/src/main/assets/native/lib app/src/main/assets/native/models
          cp imgui_overlay/libs/arm64-v8a/imgui app/src/main/assets/native/imgui
          cp imgui_overlay/lib/arm64-v8a/*.so app/src/main/assets/native/lib/
          cp models/*.tflite models/*.txt app/src/main/assets/native/models/
          cp models/valorant_256_v26n.tflite app/src/main/assets/native/valorant_256_v26n.tflite
          echo "--- assets/native ---"; ls -la app/src/main/assets/native
          echo "--- assets/native/lib ---"; ls app/src/main/assets/native/lib
          echo "--- assets/native/models ---"; ls app/src/main/assets/native/models

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/release/
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "assets/native/imgui|assets/native/models/valorant_256_v26n.tflite"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 打 tag (v*) 时额外发布 GitHub Release，附带 APK
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
